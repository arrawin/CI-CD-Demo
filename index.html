<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CI CD Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', monospace;
  }

  body {
    height: 100vh;
    background: #0f172a;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }

  h1 {
    font-size: 3rem;
    text-align: center;
    z-index: 10;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 900;
    text-shadow: 
      0 0 10px #38bdf8,
      0 0 20px #38bdf8,
      0 0 40px #38bdf8,
      0 0 80px rgba(56, 189, 248, 0.5);
    animation: glow-pulse 2s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% {
      text-shadow: 
        0 0 10px #38bdf8,
        0 0 20px #38bdf8,
        0 0 40px #38bdf8,
        0 0 80px rgba(56, 189, 248, 0.5);
    }
    50% {
      text-shadow: 
        0 0 20px #38bdf8,
        0 0 30px #38bdf8,
        0 0 60px #38bdf8,
        0 0 100px rgba(56, 189, 248, 0.8);
    }
  }

  span {
    display: block;
    font-size: 1.2rem;
    margin-top: 15px;
    font-weight: 400;
    color: #38bdf8;
    text-shadow: 
      0 0 10px #38bdf8,
      0 0 20px rgba(56, 189, 248, 0.8);
  }

  /* Floating lines container */
  .lines {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
  }

  .line {
    position: absolute;
    width: 2px;
    height: 200px;
    background: linear-gradient(transparent, #38bdf8, transparent);
    animation: float 6s linear infinite;
    opacity: 0.6;
  }

  @keyframes float {
    0% {
      transform: translateY(-200px);
    }
    100% {
      transform: translateY(110vh);
    }
  }

  /* Cursor glow effect */
  .cursor-glow {
    position: fixed;
    width: 30px;
    height: 30px;
    border: 2px solid #38bdf8;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 20px #38bdf8, inset 0 0 20px rgba(56, 189, 248, 0.3);
    z-index: 1000;
    transform: translate(-50%, -50%);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 0 20px #38bdf8, inset 0 0 20px rgba(56, 189, 248, 0.3);
    }
    50% {
      box-shadow: 0 0 40px #38bdf8, inset 0 0 20px rgba(56, 189, 248, 0.6);
    }
  }

  /* Ripple effect */
  .ripple {
    position: fixed;
    border: 2px solid #38bdf8;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    animation: ripple-animation 0.8s ease-out;
  }

  @keyframes ripple-animation {
    0% {
      width: 20px;
      height: 20px;
      opacity: 1;
    }
    100% {
      width: 100px;
      height: 100px;
      opacity: 0;
    }
  }

</style>
</head>
<body>

<div class="lines">
  <div class="line" style="left:10%; animation-delay:0s;"></div>
  <div class="line" style="left:20%; animation-delay:2s;"></div>
  <div class="line" style="left:35%; animation-delay:4s;"></div>
  <div class="line" style="left:50%; animation-delay:1s;"></div>
  <div class="line" style="left:65%; animation-delay:3s;"></div>
  <div class="line" style="left:80%; animation-delay:5s;"></div>
  <div class="line" style="left:90%; animation-delay:2.5s;"></div>
</div>

<h1>
  CI CD Demo
  <span>by Arrawin!</span>
</h1>

<script>
  // Create cursor glow element
  const cursorGlow = document.createElement('div');
  cursorGlow.className = 'cursor-glow';
  document.body.appendChild(cursorGlow);

  let mouseX = 0;
  let mouseY = 0;
  let glowX = 0;
  let glowY = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;

    // Smooth follow animation
    glowX += (mouseX - glowX) * 0.2;
    glowY += (mouseY - glowY) * 0.2;

    cursorGlow.style.left = glowX + 'px';
    cursorGlow.style.top = glowY + 'px';

    // Create ripple effect on mouse movement (less frequently)
    if (Math.random() > 0.8) {
      createRipple(mouseX, mouseY);
    }
  });

  function createRipple(x, y) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.body.appendChild(ripple);

    setTimeout(() => {
      ripple.remove();
    }, 800);
  }

  // Hide cursor
  document.body.style.cursor = 'none';
</script>

</body>
</html>
